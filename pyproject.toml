[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "molvector"
version = "1.12.0-beta.2"
description = "Interactive 3D Molecule Viewer and Builder"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Corentin Rossi", email = "corentin.mj.rossi@gmail.com" }]
dependencies = [
    "numpy>=1.21",
    "svgwrite",
    "PyQt6>=6.5",
    "mol_strudel",
    "cclib>=1.8",
]

[project.optional-dependencies]
spectra = ["matplotlib"]
openbabel = ["openbabel-wheel"]
chemvector = ["rdkit"]

[project.urls]
Homepage = "https://github.com/CorentinRossi/Molvector"

[project.scripts]
molvector = "molvector:main"
molvector-setup = "molvector.setup_openbabel:setup"

[tool.setuptools.packages.find]
include = ["molvector*"]

[tool.setuptools.package-data]
molvector = ["assets/**/*", "test_files/*"]

[tool.setuptools]
zip-safe = false
